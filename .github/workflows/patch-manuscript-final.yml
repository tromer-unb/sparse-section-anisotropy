name: patch-manuscript-final

on:
  push:
    branches: [reproducibility-overhaul]
    paths: [.github/workflows/patch-manuscript-final.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reproducibility-overhaul
          fetch-depth: 0
      - name: Apply final approved wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('manuscript/main.tex')
          s = p.read_text()
          old = '''The methodology was evaluated in three successive stages. First, synthetic
          porous media were used to establish rotation equivariance, anisotropy
          sensitivity, and the identifiability of the inverse problem under controlled
          conditions. Second, the dependence of reconstruction accuracy on the number
          and orientation of available sections was quantified. Third, the method was
          validated on segmented micro-computed-tomography (micro-CT) images of real
          rocks, for which the complete 3D volume was retained exclusively as ground
          truth while the inversion algorithm received only sparse virtual sections.
          No 3D voxel reconstruction, machine-learning model, or sample-to-sample
          training was used at any stage.'''
          new = '''The methodology was evaluated in three successive stages. First, synthetic
          porous media were used to establish rotation equivariance, anisotropy
          sensitivity, and the identifiability of the inverse problem under controlled
          conditions. Second, the dependence of reconstruction accuracy on the number
          and orientation of available sections was quantified. Third, the method was
          validated on segmented micro-computed-tomography (micro-CT) images of real
          rocks. For these data, the complete 3D image was used only to construct a
          numerical reference tensor, while the sparse inversion received only virtual
          2D sections and their orientations. No 3D voxel reconstruction,
          machine-learning model, or sample-to-sample training was used at any stage.'''
          if old not in s:
              raise SystemExit('target paragraph not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manuscript/main.tex
          git commit -m "manuscript: clarify numerical reference in study design"
          git push origin HEAD:reproducibility-overhaul
